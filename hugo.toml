baseURL = "https://docs.bfportal.gg/"
locale = "en-US"
title = "Portal Documentation"

titleCaseStyle = "Go"
disablePathToLower = true

[outputs]
    home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark.renderer]
    # Needed for mermaid shortcode
    unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 9

# No page is tagged, so the tag pages are not built.
disableKinds = ["taxonomy", "term"]

[[module.mounts]]
source = "hugo/archetypes"
target = "archetypes"

[[module.mounts]]
source = "hugo/assets"
target = "assets"

[[module.mounts]]
source = "hugo/data"
target = "data"

[[module.mounts]]
source = "hugo/i18n"
target = "i18n"

[[module.mounts]]
source = "hugo/layouts"
target = "layouts"

[[module.mounts]]
source = "hugo/static"
target = "static"

[[module.mounts]]
source = "docs/"
target = "./content/"
files = ["! portal_blocks/**"]

[[module.mounts]]
source = "docs/portal_blocks"
target = "./content/portal-builder/rules-editor/block-reference"

[params]
    description = "Community-written documentation for the Battlefield Portal editor: the rules editor, its blocks, maps, and the BF6 scripting API."
    # "Edit this page" points here.
    githubRepo = "https://github.com/battlefield-portal-community/portal-docs"
    editPath = "edit/main/docs"
